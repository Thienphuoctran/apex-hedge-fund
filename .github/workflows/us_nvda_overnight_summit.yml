name: "Overnight US, NVDA Earnings & 04:30 Summit (Cloud)"

on:
  # schedule disabled (one-off historical run); manual execution preserved
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Nhịp chạy thủ công (auto, 2030_MOBILIZE, 2110_PREP, 2130_OPEN, 2230_POST_AMATEUR, 0100_MID_SESSION, 0402_OFFICIAL_CLOSE, 0425_NVDA_EARNINGS_AH, 0430_SUMMIT)"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: apex-repo-push
  cancel-in-progress: false

jobs:
  overnight_us_nvda_summit:
    name: "US NVDA VIX Watch & 04:30 Summit Engine"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Install Dependencies"
        run: |
          pip install --upgrade pip
          pip install yfinance requests pandas pyyaml

      - name: "Run Overnight Summit Checkpoint Engine"
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/us_nvda_overnight_summit_engine.py --checkpoint "${{ github.event.inputs.checkpoint || 'auto' }}"

      - name: "Commit & Push Overnight Telemetry / Summit Results"
        run: |
          git config --global user.name "Apex Cloud Summit Bot"
          git config --global user.email "cloud-summit@apex-fund.internal"
          git add -A data/us_live_session_log_2026-11-18.json data/apex_active_meeting_state.json data/summit_archive_ledger.json 08_Master_Investment_CIO/ VN_Market/07_Daily_Specialist/ data/summit_archive/ 00_LIVE_INTER_CHAT_STATE.md data/palmer_* data/telegram_dedup_cache.json
          if git diff --staged --quiet; then
            echo "No overnight summit changes to commit."
          else
            git commit -m "chore(summit): Overnight US NVDA/VIX watch & 04:30 Summit sync [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD || echo "Push skipped"
          fi
