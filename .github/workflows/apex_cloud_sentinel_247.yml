name: Apex Cloud Sentinel 24/7 & Institutional SSOT Guardian

on:
  schedule:
    # Quét định kỳ mỗi 30 phút trong phiên giao dịch VN (01:00 - 08:30 UTC <=> 08:00 - 15:30 VN, Thứ 2 - Thứ 6)
    - cron: '*/30 1-8 * * 1-5'
    # Ban 12 Trọng: Phiên Kiểm Sát Kỷ Luật & Chuyên Môn lúc 23:30 VN hàng ngày (16:30 UTC)
    - cron: '30 16 * * *'
    # Quét kiểm toán toàn vẹn dữ liệu lúc 00:00 UTC hàng ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép Chủ tịch bấm nút kích hoạt quét tức thời 24/7 từ điện thoại qua GitHub Mobile App
    inputs:
      action:
        description: 'Hành động thực thi (scan-once / full-audit / sync-ssot)'
        required: true
        default: 'scan-once'

permissions:
  contents: write

jobs:
  cloud_sentinel_guardian:
    name: Victor Sentinel 24/7 & SSOT V2.0 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Apex Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Cloud Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy fastapi uvicorn

      - name: 1. Institutional SSOT V2.0 & Temporal Audit
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import json
          with open('data/current_portfolio_state.json', 'r', encoding='utf-8') as f:
              state = json.load(f)
          assert state.get('account_id') == '105C307855', 'Sai mã tài khoản TCBS'
          cash_bal = float(state.get('cash_balance_vnd', -1))
          total_nav = float(state.get('total_nav_vnd', -1))
          assert cash_bal >= 0 and total_nav >= cash_bal, f'Số dư SSOT bất hợp lệ: cash={cash_bal}, nav={total_nav}'
          assert state.get('status') in ('ALL_CASH_STANDDOWN', 'ACTIVE_HOLDING', 'DEFENSIVE_HOLDING'), f'Trạng thái không hợp lệ: {state.get(\"status\")}'
          print(f'✅ [PASS] SSOT V2.0 Audit: Tài khoản 105C307855 | Cash={cash_bal:,.0f} đ | NAV={total_nav:,.0f} đ | Status={state.get(\"status\")}')
          "

      - name: 2. Run 145-Stock Full Market Scanner & 10-Department Council Orchestrator
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/apex_full_council_orchestrator.py

      - name: 3. Run Victor Sentinel Audit Scan
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/intraday_portfolio_sentinel.py --scan-once

      - name: 4. Verify Cloud Sentinel Web App Health
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import cloud_sentinel.main as m
          assert m.app is not None, 'FastAPI app không khởi tạo được'
          print('✅ [PASS] Cloud Sentinel Web Engine (FastAPI) sẵn sàng 100% cho Render/Docker.')
          "

      - name: 5. Ban 12 Trong: 24/7 Technical Integrity & 23h30 Institutional Audit
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/apex_inspector_trong.py --run-23h30-audit
          python scripts/migrate_markdown_to_sqlite.py

      - name: 6. Commit & Push Updated Status, Market Scan, Audit & Cross-Day Continuity Ledger
        run: |
          git config --global user.name "Apex Cloud Sentinel Bot"
          git config --global user.email "sentinel-bot@apex-fund.internal"
          git add data/ VN_Market/data/ 08_Master_Investment_CIO/ 09_Realtime_Portfolio_Sentinel/ 12_Institutional_Ombudsman_And_Inspectorate/ cloud_sentinel/
          if git diff --staged --quiet; then
            echo "Dữ liệu SSOT đã ở trạng thái tối ưu nhất, không có thay đổi mới."
          else
            git commit -m "chore(sentinel): Automated 24/7 Cloud Sentinel, 145-Stock Scan, Trong Audit & Memory Sync [skip ci]"
            git push origin HEAD || echo "Push failed or no upstream configured."
          fi
