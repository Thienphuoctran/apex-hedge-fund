name: "Victor 24/7 Intraday Portfolio Sentinel & CBTT Radar"

on:
  schedule:
    # Quét lệch pha (phút 7, 22, 37, 52) trong giờ giao dịch Việt Nam (09:00 - 15:00 VN) Thứ 2 - Thứ 6, tránh đụng độ cron :00/:30
    - cron: '7,22,37,52 2-8 * * 1-5'
    # Quét lệch pha trong giờ giao dịch Mỹ (20:30 - 03:30 VN) Thứ 2 - Thứ 6
    - cron: '7,22,37,52 13-20 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút quét thủ công trên GitHub bất cứ lúc nào

permissions:
  contents: write

concurrency:
  group: apex-repo-push
  cancel-in-progress: false

jobs:
  sentinel_scan:
    name: "Victor Intraday Sentinel & CBTT Radar"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Install Dependencies"
        run: |
          pip install --upgrade pip
          pip install yfinance requests pandas

      - name: "Run CBTT Filings & SEC Radar 24/7"
        env:
          TZ: "Asia/Ho_Chi_Minh"
          APEX_ALLOW_CLOUD_TELEGRAM_PUSH: "0"
        run: |
          python scripts/cbtt_filings_radar.py || echo "CBTT radar completed with warnings"

      - name: "Run Victor Sentinel Intraday Scan"
        env:
          TZ: "Asia/Ho_Chi_Minh"
          APEX_ALLOW_CLOUD_TELEGRAM_PUSH: "0"
        run: |
          python scripts/intraday_portfolio_sentinel.py --scan-once

      - name: "Commit & Push New Disclosures"
        run: |
          git config --global user.name "Apex Cloud Sentinel"
          git config --global user.email "cloud-sentinel@apex-fund.internal"
          git checkout -- data/current_portfolio_state.json || true
          git add data/cbtt_live_radar.json 02_Equity_Research/ VN_Market/02_BCTC_Equity_Research/ 09_Realtime_Portfolio_Sentinel/
          if git diff --staged --quiet; then
            echo "No new filings."
          else
            git commit -m "chore(radar): Live CBTT filings & Victor scan sync [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD || echo "Push failed or no upstream"
          fi
