services:
  - type: web
    name: apex-hedge-fund-247
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APEX_PORTAL_PIN
        sync: false
      - key: APEX_SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
